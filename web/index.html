<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Coding Agent - WebUI</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #24344d;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-purple: #a855f7;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航栏 */
    header {
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      font-size: 24px;
    }

    .brand-title {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.5px;
    }

    .brand-tag {
      font-size: 11px;
      background: #0369a1;
      color: #e0f2fe;
      padding: 2px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .controls-top {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }

    select, input[type="text"] {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent-blue);
    }

    /* 会话状态条 */
    .session-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #111d33;
      border: 1px solid #1e3a5f;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
    }

    .session-id {
      color: var(--accent-blue);
      font-family: var(--font-mono);
      font-weight: 600;
    }

    .session-turns {
      color: var(--text-muted);
    }

    .status-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge.info { background: #1e3a8a; color: #93c5fd; }
    .status-badge.running { background: #78350f; color: #fde68a; animation: pulse 1.5s infinite; }
    .status-badge.success { background: #064e3b; color: #6ee7b7; }
    .status-badge.warn { background: #831843; color: #fbcfe8; }
    .status-badge.danger { background: #7f1d1d; color: #fca5a5; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* Soul 折叠侧栏/顶部条 */
    .soul-bar {
      background: #192237;
      border-bottom: 1px solid var(--border-color);
      padding: 8px 24px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      transition: background-color 0.3s ease;
    }

    .soul-bar.updated-flash {
      background: #2e1065;
      animation: flash 1s ease;
    }

    @keyframes flash {
      0% { background-color: #581c87; }
      100% { background-color: #192237; }
    }

    .soul-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .soul-icon {
      font-size: 14px;
    }

    .soul-label {
      font-weight: 600;
      color: var(--accent-purple);
    }

    .soul-summary-text {
      color: #e2e8f0;
      max-width: 700px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 主容器 */
    main {
      flex: 1;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 140px;
    }

    /* 空状态 */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 80px;
      color: var(--text-muted);
      text-align: center;
      gap: 12px;
    }

    .empty-icon {
      font-size: 48px;
      opacity: 0.5;
    }

    /* 事件卡片流 */
    .events-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .event-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      animation: fadeIn 0.25s ease-out;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      background: rgba(0, 0, 0, 0.2);
      padding: 8px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .card-body {
      padding: 14px 16px;
    }

    .time {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* 轮次与会话分隔条 */
    .turn-divider {
      display: flex;
      align-items: center;
      margin: 12px 0;
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .turn-divider::before,
    .turn-divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px dashed var(--border-color);
    }

    .turn-divider span {
      padding: 0 10px;
      font-weight: 600;
      color: var(--accent-blue);
    }

    /* 用户与助手消息 */
    .message-card.user {
      border-left: 4px solid var(--accent-blue);
    }

    .message-card.assistant {
      border-left: 4px solid var(--accent-emerald);
    }

    .role-badge {
      font-weight: 600;
      font-size: 12px;
    }

    .role-badge.user { color: var(--accent-blue); }
    .role-badge.assistant { color: var(--accent-emerald); }

    .text-content {
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-wrap;
    }

    /* 工具调用与结果 */
    .tool-card {
      border-left: 4px solid var(--accent-amber);
    }

    .tool-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .call-id {
      color: var(--text-muted);
      font-size: 11px;
      font-family: var(--font-mono);
    }

    .status-indicator {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .status-indicator.loading {
      background: #78350f;
      color: #fef08a;
    }

    .status-indicator.success {
      background: #064e3b;
      color: #a7f3d0;
    }

    .status-indicator.failed {
      background: #7f1d1d;
      color: #fecaca;
    }

    .code-block {
      background: #0b1120;
      color: #e2e8f0;
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      overflow-x: auto;
      border: 1px solid #1e293b;
      white-space: pre-wrap;
    }

    .tool-result-box {
      margin-top: 10px;
      border-top: 1px dashed var(--border-color);
      padding-top: 10px;
    }

    .toggle-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .toggle-btn {
      background: none;
      border: none;
      color: var(--accent-blue);
      cursor: pointer;
      font-size: 11px;
    }

    .toggle-btn:hover {
      text-decoration: underline;
    }

    .result-code.collapsed {
      max-height: 80px;
      overflow: hidden;
      position: relative;
    }

    .result-code.collapsed::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 30px;
      background: linear-gradient(transparent, #0b1120);
    }

    /* 提问与权限审批 Ask */
    .ask-card {
      border: 2px solid var(--accent-amber);
      background: #272c3d;
    }

    .ask-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ask-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .ask-badge.permission {
      background: #b45309;
      color: #fef3c7;
    }

    .ask-badge.user {
      background: #0284c7;
      color: #e0f2fe;
    }

    .ask-badge.plan_approval {
      background: #7c2d12;
      color: #ffedd5;
    }

    .ask-question {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fef08a;
    }

    .ask-form {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .ask-form input, .ask-form textarea {
      flex: 1;
      padding: 8px 12px;
    }

    .reply-tag {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 600;
    }

    .reply-tag.approved { background: #065f46; color: #a7f3d0; }
    .reply-tag.rejected { background: #881337; color: #fecdd3; }
    .reply-tag.answered { background: #075985; color: #bae6fd; }
    .reply-tag.revised { background: #1e3a8a; color: #bfdbfe; }

    /* ── Phase 4 Step 2: Command 系统通知卡 ── */
    .command-card {
      border-left: 4px solid var(--accent-blue);
      background: #132238;
    }

    .command-title {
      font-weight: 600;
      color: var(--accent-blue);
    }

    /* ── Phase 4 Step 3: Goal & Plan 结构化卡片 ── */
    .goal-card {
      border: 1px solid #0369a1;
      border-left: 4px solid var(--accent-blue);
      background: #0c2340;
    }

    .goal-title {
      font-weight: 700;
      color: var(--accent-blue);
    }

    .goal-criteria-list {
      list-style: none;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .goal-criteria-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      color: #e2e8f0;
    }

    .goal-check-icon {
      color: var(--accent-emerald);
      font-weight: bold;
    }

    .plan-card {
      border: 1px solid #3b82f6;
      border-left: 4px solid #60a5fa;
      background: #172554;
    }

    .plan-header-status {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .plan-status-proposed { background: #78350f; color: #fde68a; }
    .plan-status-approved { background: #064e3b; color: #6ee7b7; }
    .plan-status-rejected { background: #7f1d1d; color: #fca5a5; }
    .plan-status-revised { background: #1e3a8a; color: #93c5fd; }

    .plan-frozen-warning {
      background: #451a03;
      border: 1px solid #d97706;
      color: #fef3c7;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .plan-steps-list {
      list-style-position: inside;
      margin: 8px 0;
      font-size: 13px;
      line-height: 1.6;
    }

    .plan-risks-box {
      margin-top: 10px;
      background: rgba(0, 0, 0, 0.25);
      border-left: 3px solid var(--accent-amber);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      color: #fde68a;
    }

    .illegal-side-effect-alert {
      border: 2px solid #ef4444 !important;
      background: #450a0a !important;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* ── Phase 4 Step 4/5/6: Runtime Status (Completion, Stall, Early Stop) ── */
    .completion-card {
      border-left: 4px solid var(--accent-amber);
      background: #25241f;
    }

    .completion-card.verified {
      border-left: 4px solid var(--accent-emerald);
      background: #142e26;
    }

    .stall-warning-card {
      border-left: 4px solid var(--accent-amber);
      background: #422006;
      color: #fef08a;
    }

    .early-stop-card {
      border: 2px solid var(--accent-rose);
      background: #450a0a;
    }

    .soul-toast-card {
      border-left: 4px solid var(--accent-purple);
      background: #2e1065;
      color: #e9d5ff;
    }

    /* 完成 Done */
    .done-card {
      border: 2px solid var(--accent-emerald);
      background: #193630;
    }

    .done-badge {
      font-weight: 700;
      color: var(--accent-emerald);
      font-size: 13px;
    }

    /* 错误 Error */
    .error-card {
      border: 2px solid var(--accent-rose);
      background: #381b23;
    }

    .error-badge {
      font-weight: 700;
      color: var(--accent-rose);
    }

    .error-text {
      color: #fecaca;
      font-size: 14px;
    }

    /* 底部操作区 */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border-color);
      padding: 14px 24px;
      z-index: 100;
    }

    .input-bar {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      position: relative;
    }

    .command-badge {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--accent-purple);
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      display: none;
    }

    .task-input {
      flex: 1;
      padding: 10px 16px;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .task-input.command-mode {
      padding-left: 80px;
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 1px var(--accent-purple);
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #0284c7;
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #0369a1;
    }

    .btn-danger {
      background: #be123c;
      color: white;
    }

    .btn-danger:hover:not(:disabled) {
      background: #9f1239;
    }

    .btn-secondary {
      background: #334155;
      color: #cbd5e1;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #475569;
    }

    .btn-warning {
      background: #d97706;
      color: white;
    }

    .btn-warning:hover:not(:disabled) {
      background: #b45309;
    }
  </style>
</head>
<body>
  <!-- 顶部状态导航 -->
  <header>
    <div class="brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-title">Coding Agent WebUI</span>
      <span class="brand-tag">Phase 4 Full</span>
    </div>

    <div class="controls-top">
      <!-- 会话条 -->
      <div class="session-bar" id="session-bar">
        <span>Session:</span>
        <select id="session-select" title="切换会话" style="max-width: 160px;"></select>
        <span class="session-id" id="session-id-display">sess-default</span>
        <span class="session-turns" id="session-turn-display">(Turn 1)</span>
      </div>
      <button id="new-session-btn" class="btn btn-secondary" style="padding: 4px 8px; font-size: 12px;">+ 新建会话</button>

      <div class="control-group">
        <label for="source-mode">模式:</label>
        <select id="source-mode">
          <option value="mock">Mock 剧本 (离线演示)</option>
          <option value="sse">Live API (真后端 SSE)</option>
        </select>
      </div>

      <div class="control-group" id="scenario-container">
        <label for="scenario-select">剧本:</label>
        <select id="scenario-select">
          <optgroup label="基础基线">
            <option value="case1">Case 1: 读取分析代码</option>
            <option value="case2">Case 2: 写入/Shell/权限审批</option>
            <option value="case3">Case 3: 异常与自我纠错</option>
          </optgroup>
          <optgroup label="Step 1: Session 连续对话 & 隔离">
            <option value="session_case1">Session Case 1: 连续多轮记忆 (引用上一轮产物)</option>
            <option value="session_iso">Session Case 2: 会话隔离演示</option>
          </optgroup>
          <optgroup label="Step 2: Soul & 命令">
            <option value="soul_init">Soul Case 1: /init 建立人设偏好</option>
            <option value="soul_effect">Soul Case 2: Soul 偏好影响代码行为</option>
          </optgroup>
          <optgroup label="Step 3: Plan & Goal 审批 Gate">
            <option value="plan_approve">Plan Case 1: 计划提出与 Approve 批准执行</option>
            <option value="plan_reject">Plan Case 2: 计划 Reject 驳回 (无副作用)</option>
            <option value="plan_revise">Plan Case 3: 计划 Revise 修改建议重排</option>
          </optgroup>
          <optgroup label="Step 4/5/6: 运行时状态">
            <option value="completion_gate">Step 4: Completion 未达标驳回与补做</option>
            <option value="early_stop_stall">Step 5: 停滞重复与 Early Stop 熔断</option>
            <option value="memory_consolidate">Step 6: 会话沉淀为长期 Soul 记忆</option>
          </optgroup>
        </select>
      </div>

      <div class="control-group" id="backend-url-container" style="display: none;">
        <label for="backend-url">服务地址:</label>
        <input type="text" id="backend-url" value="http://localhost:8046" style="width: 170px;">
      </div>

      <span id="status-badge" class="status-badge info">Ready</span>
      <button id="clear-btn" class="btn btn-secondary" style="padding: 4px 10px;">清屏</button>
    </div>
  </header>

  <!-- Soul 人设状态展示条（可折叠） -->
  <div class="soul-bar" id="soul-bar">
    <div class="soul-left">
      <span class="soul-icon">🧠</span>
      <span class="soul-label">SOUL / Memory:</span>
      <span class="soul-summary-text" id="soul-summary">未载入长期人设 (使用 /init 初始化或等待系统载入)</span>
    </div>
    <span style="font-size: 11px; opacity: 0.7;">.agent/SOUL.md</span>
  </div>

  <!-- 中间事件卡片流 -->
  <main>
    <div id="empty-state" class="empty-state">
      <div class="empty-icon">💬</div>
      <h2>准备就绪</h2>
      <p>在底部输入任务并点击“发送任务”启动 Agent 事件流。</p>
      <p style="font-size: 12px; color: #64748b;">支持通过顶部剧本切换体验 Phase 4 全套能力（Session、Soul、/init、/plan 审批、Completion Gate、早停与记忆沉淀）。</p>
    </div>

    <div id="events-list" class="events-list"></div>
  </main>

  <!-- 底部任务输入控制栏 -->
  <footer>
    <div class="input-bar">
      <span id="command-badge" class="command-badge">COMMAND</span>
      <input type="text" id="task-input" class="task-input" placeholder="输入 Agent 任务，或输入 /init、/plan 等斜杠命令..." />
      <button id="send-btn" class="btn btn-primary">
        <span>🚀 发送任务</span>
      </button>
      <button id="stop-btn" class="btn btn-secondary" disabled>
        <span>⏹ 停止</span>
      </button>
    </div>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
