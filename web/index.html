<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Coding Agent - WebUI</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #24344d;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航栏 */
    header {
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      font-size: 24px;
    }

    .brand-title {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.5px;
    }

    .brand-tag {
      font-size: 11px;
      background: #0369a1;
      color: #e0f2fe;
      padding: 2px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .controls-top {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }

    select, input[type="text"] {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent-blue);
    }

    .status-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge.info { background: #1e3a8a; color: #93c5fd; }
    .status-badge.running { background: #78350f; color: #fde68a; animation: pulse 1.5s infinite; }
    .status-badge.success { background: #064e3b; color: #6ee7b7; }
    .status-badge.warn { background: #831843; color: #fbcfe8; }
    .status-badge.danger { background: #7f1d1d; color: #fca5a5; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* 主容器 */
    main {
      flex: 1;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 120px;
    }

    /* 空状态 */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 80px;
      color: var(--text-muted);
      text-align: center;
      gap: 12px;
    }

    .empty-icon {
      font-size: 48px;
      opacity: 0.5;
    }

    /* 事件卡片流 */
    .events-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .event-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      animation: fadeIn 0.25s ease-out;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      background: rgba(0, 0, 0, 0.2);
      padding: 8px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .card-body {
      padding: 14px 16px;
    }

    .time {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* 用户与助手消息 */
    .message-card.user {
      border-left: 4px solid var(--accent-blue);
    }

    .message-card.assistant {
      border-left: 4px solid var(--accent-emerald);
    }

    .role-badge {
      font-weight: 600;
      font-size: 12px;
    }

    .role-badge.user { color: var(--accent-blue); }
    .role-badge.assistant { color: var(--accent-emerald); }

    .text-content {
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-wrap;
    }

    /* 工具调用与结果 */
    .tool-card {
      border-left: 4px solid var(--accent-amber);
    }

    .tool-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .call-id {
      color: var(--text-muted);
      font-size: 11px;
      font-family: var(--font-mono);
    }

    .status-indicator {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .status-indicator.loading {
      background: #78350f;
      color: #fef08a;
    }

    .status-indicator.success {
      background: #064e3b;
      color: #a7f3d0;
    }

    .status-indicator.failed {
      background: #7f1d1d;
      color: #fecaca;
    }

    .code-block {
      background: #0b1120;
      color: #e2e8f0;
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      overflow-x: auto;
      border: 1px solid #1e293b;
      white-space: pre-wrap;
    }

    .tool-result-box {
      margin-top: 10px;
      border-top: 1px dashed var(--border-color);
      padding-top: 10px;
    }

    .toggle-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .toggle-btn {
      background: none;
      border: none;
      color: var(--accent-blue);
      cursor: pointer;
      font-size: 11px;
    }

    .toggle-btn:hover {
      text-decoration: underline;
    }

    .result-code.collapsed {
      max-height: 80px;
      overflow: hidden;
      position: relative;
    }

    .result-code.collapsed::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 30px;
      background: linear-gradient(transparent, #0b1120);
    }

    /* 提问与权限审批 Ask */
    .ask-card {
      border: 2px solid var(--accent-amber);
      background: #272c3d;
    }

    .ask-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ask-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .ask-badge.permission {
      background: #b45309;
      color: #fef3c7;
    }

    .ask-badge.user {
      background: #0284c7;
      color: #e0f2fe;
    }

    .ask-question {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fef08a;
    }

    .ask-form {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .ask-form input {
      flex: 1;
      padding: 8px 12px;
    }

    .reply-tag {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 600;
    }

    .reply-tag.approved { background: #065f46; color: #a7f3d0; }
    .reply-tag.rejected { background: #881337; color: #fecdd3; }
    .reply-tag.answered { background: #075985; color: #bae6fd; }

    /* 完成 Done */
    .done-card {
      border: 2px solid var(--accent-emerald);
      background: #193630;
    }

    .done-badge {
      font-weight: 700;
      color: var(--accent-emerald);
      font-size: 13px;
    }

    /* 错误 Error */
    .error-card {
      border: 2px solid var(--accent-rose);
      background: #381b23;
    }

    .error-badge {
      font-weight: 700;
      color: var(--accent-rose);
    }

    .error-text {
      color: #fecaca;
      font-size: 14px;
    }

    /* 底部操作区 */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border-color);
      padding: 14px 24px;
      z-index: 100;
    }

    .input-bar {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
    }

    .task-input {
      flex: 1;
      padding: 10px 16px;
      font-size: 14px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #0284c7;
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #0369a1;
    }

    .btn-danger {
      background: #be123c;
      color: white;
    }

    .btn-danger:hover:not(:disabled) {
      background: #9f1239;
    }

    .btn-secondary {
      background: #334155;
      color: #cbd5e1;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #475569;
    }
  </style>
</head>
<body>
  <!-- 顶部状态导航 -->
  <header>
    <div class="brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-title">Coding Agent WebUI</span>
      <span class="brand-tag">Phase 4 (P2)</span>
    </div>

    <div class="controls-top">
      <div class="control-group">
        <label for="source-mode">模式:</label>
        <select id="source-mode">
          <option value="mock">Mock 剧本 (离线演示)</option>
          <option value="sse">Live API (真后端 SSE)</option>
        </select>
      </div>

      <div class="control-group" id="scenario-container">
        <label for="scenario-select">剧本:</label>
        <select id="scenario-select">
          <option value="case1">Case 1: 读取分析代码</option>
          <option value="case2">Case 2: 写入/Shell/权限审批</option>
          <option value="case3">Case 3: 异常与自我纠错</option>
        </select>
      </div>

      <div class="control-group" id="backend-url-container" style="display: none;">
        <label for="backend-url">服务地址:</label>
        <input type="text" id="backend-url" value="http://localhost:3000" style="width: 170px;">
      </div>

      <span id="status-badge" class="status-badge info">Ready</span>
      <button id="clear-btn" class="btn btn-secondary" style="padding: 4px 10px;">清屏</button>
    </div>
  </header>

  <!-- 中间事件卡片流 -->
  <main>
    <div id="empty-state" class="empty-state">
      <div class="empty-icon">💬</div>
      <h2>准备就绪</h2>
      <p>在底部输入任务并点击“发送任务”启动 Agent 事件流。</p>
      <p style="font-size: 12px; color: #64748b;">支持通过顶部下拉框切换测试剧本 (Case 1 / Case 2 / Case 3)。</p>
    </div>

    <div id="events-list" class="events-list"></div>
  </main>

  <!-- 底部任务输入控制栏 -->
  <footer>
    <div class="input-bar">
      <input type="text" id="task-input" class="task-input" placeholder="输入 Agent 任务..." />
      <button id="send-btn" class="btn btn-primary">
        <span>🚀 发送任务</span>
      </button>
      <button id="stop-btn" class="btn btn-secondary" disabled>
        <span>⏹ 停止</span>
      </button>
    </div>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
